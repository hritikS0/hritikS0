<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="1000" height="84" role="img" aria-label="Status: open to opportunities">
  <style>
    .m { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset=".5" stop-color="#0c121c"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c">
      <rect width="1000" height="84" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="84" fill="url(#bg)"/>
    <rect x="-260" y="0" width="260" height="84" fill="url(#sweep)">
      <animate attributeName="x" values="-260;1000" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x=".5" y=".5" width="999" height="83" rx="12" fill="none" stroke="#1e293b"/>

  <g transform="translate(500 46)" text-anchor="middle">
    <circle cx="-186" cy="-4" r="3.5" fill="#34d399">
      <animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="6" y="0" font-size="12" letter-spacing="2" fill="#94a3b8">
      hritik@sys ~ status: <tspan fill="#34d399">open_to_opportunities</tspan>
    </text>
  </g>
</svg>
