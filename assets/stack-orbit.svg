<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-labelledby="t d">
  <title id="t">Technical Stack</title>
  <desc id="d">Bento grid of technologies across Frontend, Backend, Data, AI Systems, and Infrastructure.</desc>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .m { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace; }
    .cat { font-size: 10px; font-weight: 600; fill: #94a3b8; letter-spacing: 1.6px; }
    .pill { font-size: 11px; font-weight: 500; fill: #e2e8f0; }
    .dim { font-size: 10px; fill: #64748b; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#0c121c"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx=".2" cy=".1" r=".7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#080b10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx=".85" cy=".85" r=".7">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#080b10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#475569" fill-opacity=".2"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="1000" height="356" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1000" height="356" fill="url(#bg)"/>
    <rect width="1000" height="356" fill="url(#dots)"/>
    <rect width="1000" height="356" fill="url(#glowCyan)"/>
    <rect width="1000" height="356" fill="url(#glowIndigo)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="355" rx="16" fill="none" stroke="#1e293b"/>

  <!-- Header -->
  <text class="m dim" x="28" y="32" letter-spacing="2">STACK · ARCHITECTURE</text>
  <text class="m dim" x="972" y="32" text-anchor="end" letter-spacing="1.5">TS · JS · PYTHON</text>

  <!-- ROW 1: 3 Cards (width 306 each, gap 15, x = 28, 349, 670) -->

  <!-- Card 1: Frontend -->
  <g transform="translate(28 50)">
    <rect width="306" height="140" rx="12" fill="#0d1422" stroke="#1e293b"/>
    <line x1="20" y1="1" x2="140" y2="1" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1"/>
    <circle cx="18" cy="22" r="3" fill="#38bdf8"/>
    <text class="m cat" x="28" y="25">FRONTEND</text>

    <!-- Pills Row 1 -->
    <g transform="translate(16 44)">
      <rect width="84" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="42" y="17" text-anchor="middle">React 19</text>

      <rect x="92" width="88" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="136" y="17" text-anchor="middle">Next.js 15</text>

      <rect x="188" width="86" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="231" y="17" text-anchor="middle">TypeScript</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(16 78)">
      <rect width="98" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="49" y="17" text-anchor="middle">Tailwind CSS</text>

      <rect x="106" width="112" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="162" y="17" text-anchor="middle">TanStack Query</text>

      <rect x="226" width="48" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="250" y="17" text-anchor="middle">MUI</text>
    </g>
    <text class="m dim" x="16" y="124">ui · state · streaming clients</text>
  </g>

  <!-- Card 2: Backend & API -->
  <g transform="translate(349 50)">
    <rect width="306" height="140" rx="12" fill="#0d1422" stroke="#1e293b"/>
    <line x1="20" y1="1" x2="140" y2="1" stroke="#818cf8" stroke-opacity=".45" stroke-width="1"/>
    <circle cx="18" cy="22" r="3" fill="#818cf8"/>
    <text class="m cat" x="28" y="25">BACKEND &amp; API</text>

    <!-- Pills Row 1 -->
    <g transform="translate(16 44)">
      <rect width="78" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="39" y="17" text-anchor="middle">Node.js</text>

      <rect x="86" width="84" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="128" y="17" text-anchor="middle">Express 5</text>

      <rect x="178" width="96" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="226" y="17" text-anchor="middle">REST · SSE</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(16 78)">
      <rect width="94" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="47" y="17" text-anchor="middle">JWT · RBAC</text>

      <rect x="102" width="110" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="157" y="17" text-anchor="middle">Prisma · ODM</text>

      <rect x="220" width="54" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="247" y="17" text-anchor="middle">Zod</text>
    </g>
    <text class="m dim" x="16" y="124">auth · permissions · validation</text>
  </g>

  <!-- Card 3: Data & Storage -->
  <g transform="translate(670 50)">
    <rect width="302" height="140" rx="12" fill="#0d1422" stroke="#1e293b"/>
    <line x1="20" y1="1" x2="140" y2="1" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1"/>
    <circle cx="18" cy="22" r="3" fill="#a78bfa"/>
    <text class="m cat" x="28" y="25">DATA &amp; STORAGE</text>

    <!-- Pills Row 1 -->
    <g transform="translate(16 44)">
      <rect width="96" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="48" y="17" text-anchor="middle">PostgreSQL</text>

      <rect x="104" width="88" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="148" y="17" text-anchor="middle">MongoDB</text>

      <rect x="200" width="70" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="235" y="17" text-anchor="middle">Redis</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(16 78)">
      <rect width="94" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="47" y="17" text-anchor="middle">Amazon S3</text>

      <rect x="102" width="168" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="186" y="17" text-anchor="middle">Pre-signed URLs · Vectors</text>
    </g>
    <text class="m dim" x="16" y="124">relational · cache · object store</text>
  </g>

  <!-- ROW 2: 2 Wider Cards (width 465 each, gap 14, x = 28, 507) -->

  <!-- Card 4: AI Systems -->
  <g transform="translate(28 206)">
    <rect width="465" height="126" rx="12" fill="#0d1422" stroke="#1e293b"/>
    <line x1="20" y1="1" x2="180" y2="1" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1"/>
    <circle cx="18" cy="22" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text class="m cat" x="28" y="25">AI SYSTEMS &amp; STREAMING</text>
    <text class="m dim" x="449" y="25" text-anchor="end">RAG · TOOLS</text>

    <!-- Pills Row 1 -->
    <g transform="translate(16 42)">
      <rect width="84" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="42" y="17" text-anchor="middle">LLM APIs</text>

      <rect x="92" width="98" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="141" y="17" text-anchor="middle">Tool Calling</text>

      <rect x="198" width="112" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="254" y="17" text-anchor="middle">RAG Pipelines</text>

      <rect x="318" width="115" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="375.5" y="17" text-anchor="middle">Embeddings</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(16 76)">
      <rect width="128" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="64" y="17" text-anchor="middle">Semantic Search</text>

      <rect x="136" width="132" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="202" y="17" text-anchor="middle">Token Streaming</text>

      <rect x="276" width="157" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="354.5" y="17" text-anchor="middle">Persistent Memory</text>
    </g>
  </g>

  <!-- Card 5: Infra & Ops -->
  <g transform="translate(507 206)">
    <rect width="465" height="126" rx="12" fill="#0d1422" stroke="#1e293b"/>
    <line x1="20" y1="1" x2="180" y2="1" stroke="#34d399" stroke-opacity=".45" stroke-width="1"/>
    <circle cx="18" cy="22" r="3" fill="#34d399"/>
    <text class="m cat" x="28" y="25">INFRASTRUCTURE &amp; OPS</text>
    <text class="m dim" x="449" y="25" text-anchor="end">SELF-HOSTED</text>

    <!-- Pills Row 1 -->
    <g transform="translate(16 42)">
      <rect width="118" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="59" y="17" text-anchor="middle">Linux · Termux</text>

      <rect x="126" width="134" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="193" y="17" text-anchor="middle">Docker · Compose</text>

      <rect x="268" width="66" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="301" y="17" text-anchor="middle">PM2</text>

      <rect x="342" width="91" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="387.5" y="17" text-anchor="middle">Tailscale</text>
    </g>
    <!-- Pills Row 2 -->
    <g transform="translate(16 76)">
      <rect width="128" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="64" y="17" text-anchor="middle">GitHub Actions</text>

      <rect x="136" width="132" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="202" y="17" text-anchor="middle">Vercel · Render</text>

      <rect x="276" width="157" height="26" rx="6" fill="#090e17" stroke="#1e293b"/>
      <text class="s pill" x="354.5" y="17" text-anchor="middle">Raspberry Pi Edge</text>
    </g>
  </g>
</svg>
