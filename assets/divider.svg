<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset=".25" stop-color="#1e293b" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#1e293b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="1000" y2="10" stroke="url(#line)" stroke-width="1"/>
  <rect x="-120" y="9" width="120" height="2" fill="url(#pulse)">
    <animate attributeName="x" values="-120;1000" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="500" cy="10" r="2.5" fill="#0b1018" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1"/>
</svg>
