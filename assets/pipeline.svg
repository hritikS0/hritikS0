<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d">
  <title id="t">ToolStack AI data flow</title>
  <desc id="d">A React 19 client sends requests to an Express 5 API. The API coordinates NVIDIA NIM LLM calls, PostgreSQL via Prisma, and RAG retrieval, streaming tokens back over SSE and executing real actions.</desc>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .m { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace; }
    .h { font-size: 12px; font-weight: 600; fill: #f1f5f9; letter-spacing: .8px; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .dim { font-size: 10px; fill: #64748b; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#0d131d"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#475569" fill-opacity=".22"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="16" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="319" rx="16" fill="none" stroke="#1e293b"/>

  <!-- Header bar -->
  <text class="m dim" x="32" y="34" letter-spacing="2">ARCHITECTURE · TOOLSTACK.AI</text>
  <g transform="translate(918 30)">
    <circle cx="0" cy="0" r="3" fill="#34d399">
      <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="m dim" x="10" y="3.5" letter-spacing="1.5">SSE</text>
  </g>

  <!-- Connector paths -->
  <g fill="none" stroke-width="1.25">
    <!-- Client <-> API -->
    <path d="M200 156H296" stroke="#38bdf8" stroke-opacity=".35"/>
    <path d="M296 176H200" stroke="#818cf8" stroke-opacity=".35"/>
    <!-- API <-> LLM -->
    <path d="M476 148C558 148 558 78 636 78" stroke="#38bdf8" stroke-opacity=".3"/>
    <path d="M636 92C566 92 566 158 476 158" stroke="#818cf8" stroke-opacity=".3"/>
    <!-- API <-> Database -->
    <path d="M476 164H636" stroke="#a78bfa" stroke-opacity=".3"/>
    <path d="M636 174H476" stroke="#a78bfa" stroke-opacity=".25"/>
    <!-- API <-> RAG -->
    <path d="M476 180C558 180 558 250 636 250" stroke="#38bdf8" stroke-opacity=".28"/>
    <path d="M636 264C566 264 566 190 476 190" stroke="#38bdf8" stroke-opacity=".25"/>
    <!-- LLM/DB -> Actions -->
    <path d="M812 169H848" stroke="#34d399" stroke-opacity=".35"/>
  </g>

  <!-- Subtle animated data pulses -->
  <g filter="url(#glow)">
    <circle r="2.8" fill="#38bdf8"><animateMotion dur="2s" repeatCount="indefinite" path="M200 156H296"/></circle>
    <circle r="2.6" fill="#818cf8"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M296 176H200"/></circle>
    <circle r="2.6" fill="#818cf8"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" path="M296 176H200"/></circle>

    <circle r="2.8" fill="#38bdf8"><animateMotion dur="2.2s" repeatCount="indefinite" path="M476 148C558 148 558 78 636 78"/></circle>
    <circle r="2.6" fill="#818cf8"><animateMotion dur="2s" begin=".5s" repeatCount="indefinite" path="M636 92C566 92 566 158 476 158"/></circle>

    <circle r="2.6" fill="#a78bfa"><animateMotion dur="1.8s" repeatCount="indefinite" path="M476 164H636"/></circle>
    <circle r="2.6" fill="#a78bfa"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" path="M636 174H476"/></circle>

    <circle r="2.6" fill="#38bdf8"><animateMotion dur="2.2s" begin=".4s" repeatCount="indefinite" path="M476 180C558 180 558 250 636 250"/></circle>
    <circle r="2.6" fill="#38bdf8"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M636 264C566 264 566 190 476 190"/></circle>

    <circle r="2.8" fill="#34d399"><animateMotion dur="1.4s" begin=".3s" repeatCount="indefinite" path="M812 169H848"/></circle>
  </g>

  <!-- Node cards -->
  <g>
    <!-- CLIENT -->
    <rect x="32" y="128" width="168" height="76" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="48" cy="148" r="3" fill="#38bdf8"/>
    <text class="m h" x="58" y="152">CLIENT</text>
    <text class="s sub" x="48" y="172">React 19 · TypeScript</text>
    <text class="m dim" x="48" y="188">SSE stream reader</text>

    <!-- API -->
    <rect x="296" y="128" width="180" height="76" rx="10" fill="#0f172a" stroke="#334155"/>
    <circle cx="312" cy="148" r="3" fill="#818cf8"/>
    <text class="m h" x="322" y="152">API GATEWAY</text>
    <text class="s sub" x="312" y="172">Express 5 · JWT · Zod</text>
    <text class="m dim" x="312" y="188">routing &amp; orchestration</text>

    <!-- LLM -->
    <rect x="636" y="50" width="176" height="66" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="652" cy="69" r="3" fill="#38bdf8"/>
    <text class="m h" x="662" y="73">LLM ENGINE</text>
    <text class="s sub" x="652" y="91">NVIDIA NIM</text>
    <text class="m dim" x="652" y="105">chat · vision · tools</text>

    <!-- DATABASE -->
    <rect x="636" y="134" width="176" height="66" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="652" cy="153" r="3" fill="#a78bfa"/>
    <text class="m h" x="662" y="157">DATABASE</text>
    <text class="s sub" x="652" y="175">PostgreSQL · Prisma</text>
    <text class="m dim" x="652" y="189">memory · mail · state</text>

    <!-- RAG -->
    <rect x="636" y="218" width="176" height="66" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="652" cy="237" r="3" fill="#38bdf8"/>
    <text class="m h" x="662" y="241">RAG PIPELINE</text>
    <text class="s sub" x="652" y="259">Embeddings · Cosine</text>
    <text class="m dim" x="652" y="273">PDF vector retrieval</text>

    <!-- ACTIONS -->
    <rect x="848" y="134" width="124" height="66" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="864" cy="153" r="3" fill="#34d399"/>
    <text class="m h" x="874" y="157">ACTIONS</text>
    <text class="s sub" x="864" y="175">tasks · habits</text>
    <text class="m dim" x="864" y="189">goals · projects</text>
  </g>

  <!-- Edge labels -->
  <text class="m dim" x="248" y="146" text-anchor="middle">POST /chat</text>
  <text class="m" font-size="10" x="248" y="194" text-anchor="middle" fill="#818cf8">SSE stream</text>

  <!-- Footer caption -->
  <text class="m dim" x="32" y="302">prompt → model → SSE tokens · PDFs → embeddings → retrieval · tool calls mutate real records</text>
</svg>
